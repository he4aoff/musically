<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Musically — Your Music. Your World.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; background: #09090D; color: #F8F8FC; -webkit-tap-highlight-color: transparent; }
    html[dir="rtl"] body { font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="range"] { accent-color: #8B5CF6; }
  </style>
</head>
<body class="min-h-screen pb-36 select-none">

  <header class="sticky top-0 z-30 backdrop-blur-xl bg-[#09090D]/85 border-b border-white/10 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="handleBrandClick()">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center font-black text-white text-lg shadow">M</div>
        <div><h1 id="brandTitle" class="text-lg font-extrabold tracking-tight leading-none">Musically</h1><p id="brandTagline" class="text-[11px] text-zinc-400 mt-0.5">Your Music. Your World.</p></div>
      </div>
      <div class="flex items-center gap-2">
        <span id="planHeaderBadge" class="hidden items-center gap-1 text-[11px] font-extrabold px-2.5 py-1 rounded-full"></span>
        <button id="userChip" onclick="navigate('profile')" class="hidden items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition"></button>
        <button onclick="toggleLanguage()" id="langBtn" class="px-3 py-1.5 rounded-full text-xs font-bold bg-white/10 hover:bg-white/15 transition">عربي</button>
        <div id="headerMenuWrapper" class="hidden relative">
          <button id="moreMenuBtn" onclick="toggleHeaderMenu(event)" class="relative z-50 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>
          <div id="headerDropdownMenu" class="hidden fixed sm:absolute right-4 sm:right-0 rtl:right-auto rtl:left-4 sm:rtl:left-0 top-16 sm:top-auto sm:mt-2 w-64 rounded-2xl bg-[#14141F] border border-white/20 shadow-[0_24px_60px_rgba(0,0,0,0.92)] py-2 z-50 overflow-hidden"><div id="dropdownMenuContent"></div></div>
        </div>
      </div>
    </div>
  </header>

  <div id="menuBackdrop" onclick="closeHeaderMenu()" class="hidden fixed inset-0 z-20 bg-black/65 backdrop-blur-md"></div>
  <main id="appRoot" class="max-w-5xl mx-auto px-4 pt-5"></main>

  <div id="miniPlayer" class="hidden fixed bottom-16 left-2 right-2 z-40 max-w-5xl mx-auto rounded-2xl bg-[#181822]/95 backdrop-blur-xl border border-white/10 shadow-2xl overflow-hidden">
    <div class="w-full h-1 bg-white/10"><div id="miniProgress" class="h-full bg-gradient-to-r from-violet-500 to-fuchsia-500" style="width: 0%"></div></div>
    <div class="flex items-center gap-2 sm:gap-3 p-2.5">
      <img id="miniArt" src="" referrerpolicy="no-referrer" onclick="openFullPlayer()" class="w-11 h-11 rounded-xl object-cover bg-violet-500/20 cursor-pointer shrink-0" />
      <div onclick="openFullPlayer()" class="flex-1 min-w-0 cursor-pointer"><p id="miniTitle" class="text-sm font-bold truncate">Song Title</p><p id="miniArtist" class="text-xs text-zinc-400 truncate">Artist</p></div>
      <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
        <button onclick="prevTrack()" class="p-1.5 text-zinc-300 hover:text-white"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="togglePlay()" id="miniPlayBtn" class="w-10 h-10 rounded-full bg-violet-600 hover:bg-violet-500 flex items-center justify-center text-white font-bold shrink-0"></button>
        <button onclick="nextTrack()" class="p-1.5 text-zinc-300 hover:text-white"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button onclick="toggleFavoriteCurrent()" id="miniFavBtn" class="p-1.5 text-sm">🤍</button>
        <button onclick="openAddToPlaylistCurrent()" class="hidden sm:flex p-1.5 text-xs text-zinc-300 hover:text-white">➕</button>
      </div>
    </div>
  </div>

  <nav id="bottomNav" class="hidden fixed bottom-0 inset-x-0 z-30 bg-[#111118]/95 backdrop-blur-xl border-t border-white/10 h-16">
    <div class="max-w-5xl mx-auto h-full grid grid-cols-5">
      <button onclick="navigate('home')" data-nav="home" class="nav-btn flex flex-col items-center justify-center gap-1 text-violet-400"><span class="text-lg">🏠</span><span class="text-[11px] font-bold" data-i18n="navHome">Home</span></button>
      <button onclick="navigate('search')" data-nav="search" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-400"><span class="text-lg">🔍</span><span class="text-[11px] font-bold" data-i18n="navSearch">Search</span></button>
      <button onclick="navigate('playlists')" data-nav="playlists" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-400"><span class="text-lg">🎶</span><span class="text-[11px] font-bold" data-i18n="navPlaylists">Playlists</span></button>
      <button onclick="navigate('favorites')" data-nav="favorites" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-400"><span class="text-lg">💜</span><span class="text-[11px] font-bold" data-i18n="navFavorites">Favorites</span></button>
      <button onclick="navigate('profile')" data-nav="profile" class="nav-btn flex flex-col items-center justify-center gap-1 text-zinc-400"><span class="text-lg">👤</span><span class="text-[11px] font-bold" data-i18n="navProfile">Profile</span></button>
    </div>
  </nav>

  <div id="fullPlayerModal" class="hidden fixed inset-0 z-50 bg-gradient-to-b from-[#261147] via-[#09090D] to-[#09090D] flex flex-col justify-between p-6 overflow-y-auto">
    <div class="max-w-md w-full mx-auto flex flex-col justify-between h-full gap-4">
      <div class="flex items-center justify-between">
        <button onclick="closeFullPlayer()" class="p-2 rounded-full bg-white/10 text-sm font-bold">↓</button>
        <span class="text-xs font-bold tracking-widest text-zinc-400 uppercase" data-i18n="nowPlaying">NOW PLAYING</span>
        <div class="flex items-center gap-2">
          <button onclick="openAddToPlaylistCurrent()" class="p-2 rounded-full bg-white/10 text-sm font-bold">➕</button>
          <button onclick="toggleFavoriteCurrent()" id="fullFavBtn" class="p-2 rounded-full bg-white/10 text-base">🤍</button>
        </div>
      </div>
      <div class="flex justify-center my-2"><img id="fullArt" src="" referrerpolicy="no-referrer" class="w-64 h-64 sm:w-72 sm:h-72 rounded-3xl object-cover shadow-2xl border border-white/10 bg-violet-950" /></div>
      <div><h2 id="fullTitle" class="text-2xl font-extrabold truncate">Song Title</h2><p id="fullArtist" onclick="openCurrentArtistFromPlayer()" class="text-sm text-violet-400 font-semibold mt-1 cursor-pointer hover:underline">Artist</p></div>
      <div>
        <input id="seekSlider" type="range" min="0" max="100" step="0.1" value="0" onmousedown="state.isSeeking=true" ontouchstart="state.isSeeking=true" oninput="previewSeekTime(this.value)" onchange="commitSeekAudio(this.value)" class="w-full h-1.5 rounded-lg cursor-pointer" />
        <div class="flex justify-between text-xs text-zinc-400 mt-1.5 font-mono"><span id="currentTimeLabel">0:00</span><span id="durationLabel">0:00</span></div>
      </div>
      <div class="flex items-center justify-between px-2">
        <button onclick="toggleShuffle()" id="shuffleBtn" class="p-2 rounded-full text-zinc-400 hover:text-white transition"></button>
        <button onclick="prevTrack()" class="p-2 text-white hover:text-violet-300 transition"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button onclick="togglePlay()" id="fullPlayBtn" class="w-16 h-16 rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-600 flex items-center justify-center text-white shadow-lg hover:scale-105 transition"></button>
        <button onclick="nextTrack()" class="p-2 text-white hover:text-violet-300 transition"><svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button onclick="cycleRepeat()" id="repeatBtn" class="p-2 rounded-full text-zinc-400 hover:text-white transition"></button>
      </div>
      <div class="flex items-center justify-between gap-4 bg-white/5 p-3.5 rounded-2xl border border-white/10">
        <button onclick="cycleSleepTimer()" id="sleepBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/10 text-zinc-300 hover:text-white text-xs font-bold shrink-0 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span id="sleepLabel">Off</span>
        </button>
        <div class="flex items-center gap-2.5 flex-1">
          <svg class="w-4 h-4 text-zinc-300 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <input type="range" min="0" max="1" step="0.05" value="1" oninput="setAudioVolume(this.value)" class="w-full h-1" />
        </div>
      </div>
    </div>
  </div>

  <div id="playlistModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#181822] border border-white/10 rounded-3xl max-w-sm w-full p-6 space-y-4">
      <div class="flex items-center justify-between"><h3 class="text-base font-extrabold">Add Song to Playlist</h3><button onclick="closePlaylistModal()" class="text-zinc-400 hover:text-white text-lg">✕</button></div>
      <div id="playlistModalList" class="space-y-2 max-h-60 overflow-y-auto"></div>
      <div class="flex gap-2 pt-1"><input id="quickNewPlaylistName" type="text" placeholder="New playlist name..." class="flex-1 px-3 py-2 rounded-xl bg-black/40 border border-white/10 text-xs" /><button onclick="createPlaylistFromModal()" class="px-3.5 py-2 rounded-xl bg-violet-600 text-xs font-bold">+ Create</button></div>
    </div>
  </div>

  <div id="adminEditSongModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#14141D] border border-white/15 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between"><h3 class="text-base font-extrabold text-white">✏️ Edit Song Details</h3><button onclick="closeAdminSongModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-sm">✕</button></div>
      <form onsubmit="handleAdminSaveSong(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editSongId" />
        <div><label class="block text-zinc-400 mb-1 font-bold">Artist / Singer</label><select id="editSongArtistId" required class="w-full px-3 py-2 rounded-xl bg-black/60 border border-white/10 text-sm"></select></div>
        <div><label class="block text-zinc-400 mb-1 font-bold">Song Name (English)</label><input id="editSongTitleEn" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
        <div><label class="block text-zinc-400 mb-1 font-bold">Song Name (Arabic)</label><input id="editSongTitleAr" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
        <div><label class="block text-zinc-400 mb-1 font-bold">Album Name</label><input id="editSongAlbum" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
        <div><label class="block text-zinc-400 mb-1 font-bold">Cover Artwork URL</label><input id="editSongCoverUrl" type="url" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs" /></div>
        <div><label class="block text-zinc-400 mb-1 font-bold">YouTube ID (`yt:...`) or Audio URL</label><input id="editSongAudioUrl" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs font-mono" /></div>
        <div class="flex gap-2 pt-1">
          <button id="adminSaveSongBtn" type="submit" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 font-bold text-sm text-white">Save Changes</button>
          <button type="button" onclick="deleteSongFromModal()" class="px-4 py-2.5 rounded-xl bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 font-bold text-xs">🗑️ Delete</button>
        </div>
        <p id="adminSongModalStatus" class="text-center text-emerald-400"></p>
      </form>
    </div>
  </div>

  <div id="adminUserModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#14141D] border border-white/15 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between"><h3 id="adminUserModalTitle" class="text-base font-extrabold text-white">Create User Account</h3><button onclick="closeAdminUserModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-sm">✕</button></div>
      <form onsubmit="handleAdminSaveUser(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editUserId" />
        <div class="grid grid-cols-2 gap-2.5">
          <div><label class="block text-zinc-400 mb-1 font-bold">Full Name</label><input id="editUserFullName" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
          <div><label class="block text-zinc-400 mb-1 font-bold">Username (@)</label><input id="editUserUsername" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm text-violet-300" /></div>
        </div>
        <div><label class="block text-zinc-400 mb-1 font-bold">Email Address</label><input id="editUserEmail" type="email" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
        <div class="grid grid-cols-2 gap-2.5">
          <div><label class="block text-zinc-400 mb-1 font-bold">Password</label><input id="editUserPassword" type="text" required class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
          <div><label class="block text-zinc-400 mb-1 font-bold">Subscription</label><select id="editUserTier" class="w-full px-3 py-2 rounded-xl bg-black/60 border border-white/10 text-sm"><option value="free">FREE</option><option value="premium">👑 PREMIUM</option><option value="extra">💎 EXTRA</option></select></div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div><label class="block text-zinc-400 mb-1 font-bold">Country</label><input id="editUserCountry" value="Egypt" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
          <div><label class="block text-zinc-400 mb-1 font-bold">Bio</label><input id="editUserBio" class="w-full px-3 py-2 rounded-xl bg-black/50 border border-white/10 text-sm" /></div>
        </div>
        <div class="flex items-center justify-between pt-1 bg-black/30 p-3 rounded-xl border border-white/5">
          <label class="flex items-center gap-2 cursor-pointer font-bold text-sky-300"><input id="editUserVerified" type="checkbox" class="w-4 h-4 accent-[#1D9BF0]" /> Blue Verified Badge</label>
          <label class="flex items-center gap-2 cursor-pointer font-bold text-violet-300"><input id="editUserAdmin" type="checkbox" class="w-4 h-4 accent-violet-500" /> Admin Privileges</label>
        </div>
        <button id="adminSaveUserBtn" type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 font-bold text-sm text-white">Save User Account</button>
        <p id="adminUserModalStatus" class="text-center text-emerald-400"></p>
      </form>
    </div>
  </div>

  <div id="configModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
    <div class="bg-[#14141D] border border-white/10 rounded-3xl max-w-2xl w-full max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="sticky top-0 z-10 backdrop-blur-xl bg-[#14141D]/90 border-b border-white/10 px-6 py-4 flex items-center justify-between gap-2">
        <div><h3 class="text-base font-extrabold leading-none">Account Center & Settings</h3><p id="settingsModalSubtitle" class="text-[11px] text-zinc-400 mt-0.5">Manage your profile & security</p></div>
        <div class="flex items-center gap-2"><span id="modalConnectionBadge" class="hidden text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">Demo Mode</span><button onclick="closeConfigModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/15 flex items-center justify-center text-sm">✕</button></div>
      </div>
      <div id="settingsModalBody" class="p-5 sm:p-6"></div>
    </div>
  </div>

  <div id="ytBackgroundDock" class="fixed -left-[9999px] top-0 w-64 h-48 pointer-events-none opacity-0 overflow-hidden"><div id="ytPlayerContainer"></div></div>
  <audio id="audioEl" preload="metadata"></audio>

  <script>
    function renderVerifiedBadge(sz = 'w-4 h-4') { return `<svg viewBox="0 0 22 22" class="${sz} shrink-0 inline-block text-[#1D9BF0]" fill="currentColor"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>`; }
    function renderTierBadge(tier, showFree = false) {
      const t = (tier || 'free').toLowerCase();
      if (t === 'extra') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-400/40 text-cyan-300 text-[10px] font-extrabold">💎 EXTRA</span>`;
      if (t === 'premium') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] font-extrabold">👑 PREMIUM</span>`;
      return showFree ? `<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-white/10 text-zinc-400 text-[10px] font-bold">FREE</span>` : '';
    }
    function fallbackAvatarUrl(name) { return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'User')}&background=7C3AED&color=fff&size=400&bold=true`; }

    const ICON_PLAY_SM = `<svg class="w-5 h-5 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const ICON_PAUSE_SM = `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
    const ICON_PLAY_LG = `<svg class="w-7 h-7 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const ICON_PAUSE_LG = `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
    const ICON_SHUFFLE = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>`;
    const ICON_REPEAT = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
    const ICON_REPEAT_ONE = `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="10.2" y="14.5" font-size="7.5" font-weight="bold" fill="currentColor" stroke="none">1</text></svg>`;

    function syncPlayPauseIcons(playing) {
      state.isPlaying = playing;
      const mini = document.getElementById('miniPlayBtn'), full = document.getElementById('fullPlayBtn');
      if (mini) mini.innerHTML = playing ? ICON_PAUSE_SM : ICON_PLAY_SM;

      if (url && key && window.supabase) { try { supabaseClient = window.supabase.createClient(url, key); updateModalConnectionBadge(); return true; } catch (e) {} }
      supabaseClient = null; updateModalConnectionBadge(); return false;
    }

    async function fetchAllSongsPaginated() {
      let all = [], from = 0;
      while (true) {
        const { data, error } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false }).range(from, from + 999);
        if (error) throw error; if (!data || !data.length) break; all = all.concat(data); if (data.length < 1000) break; from += 1000;
      }
      return all;
    }

    async function loadAllUsersForAdmin() {
      if (!supabaseClient || !isOwnerAdmin()) return;
      const { data, error } = await supabaseClient.from('app_users').select('*').order('created_at', { ascending: false });
      if (!error && data) state.allUsers = data;
    }

    async function loadCatalog() {
      if (supabaseClient) {
        try {
          const promises = [supabaseClient.from('artists').select('*').order('monthly_listeners', { ascending: false }), fetchAllSongsPaginated()];
          if (isOwnerAdmin()) promises.push(loadAllUsersForAdmin());
          const [aRes, allSongs] = await Promise.all(promises);
          if (aRes.error) return;
          state.artists = aRes.data || []; state.songs = allSongs || []; render(); return;
        } catch (err) { return; }
      }
      state.artists = [...DEMO_ARTISTS]; state.songs = [...DEMO_SONGS]; render();
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('regName').value.trim(), email = document.getElementById('regEmail').value.trim().toLowerCase(), password = document.getElementById('regPassword').value;
      const defaultHandle = '@' + fullName.toLowerCase().replace(/[^a-z0-9]+/g, '') + Math.floor(10 + Math.random() * 89);
      const status = document.getElementById('authStatus'), btn = document.getElementById('authSubmitBtn');
      btn.disabled = true; status.textContent = 'Creating account...';
      try {
        if (supabaseClient) {
          const { data: existingAdmins, error: checkErr } = await supabaseClient.from('app_users').select('id').eq('is_admin', true).limit(1);
          if (checkErr) throw new Error(checkErr.message);
          const savedAdminEmail = (localStorage.getItem('musically_admin_email') || '').toLowerCase().trim();
          const makeAdmin = (!existingAdmins || existingAdmins.length === 0) || (savedAdminEmail && savedAdminEmail === email);
          const baseInsert = { full_name: fullName, email, password, is_admin: makeAdmin, avatar_url: fallbackAvatarUrl(fullName), bio: 'Music lover in Egypt 🇪🇬', country: 'Egypt', favorite_genre: 'Egyptian Pop', playlists: [], followed_artists: [], favorites: state.favorites, recently_played: [], plays_count: 0 };
          let { data, error } = await supabaseClient.from('app_users').insert([{ ...baseInsert, username: defaultHandle, subscription_tier: 'free', is_verified: makeAdmin }]).select().single();
          if (error && error.message && error.message.includes('column')) { const retry = await supabaseClient.from('app_users').insert([baseInsert]).select().single(); data = retry.data; error = retry.error; }
          if (error) throw new Error(error.message.toLowerCase().includes('duplicate') ? 'Email already registered. Switch to Sign In.' : error.message);
          if (makeAdmin) localStorage.setItem('musically_admin_email', email);
          hydrateUserSession({ username: defaultHandle, subscription_tier: 'free', is_verified: makeAdmin, ...data }); await loadCatalog(); return;
        }
        hydrateUserSession({ id: 'local-' + Date.now(), full_name: fullName, username: defaultHandle, email, is_admin: true, is_verified: true, subscription_tier: 'free', avatar_url: fallbackAvatarUrl(fullName) });
        render();
      } catch (err) { status.textContent = '❌ ' + (err.message || 'Registration failed'); }
      finally { btn.disabled = false; }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase(), password = document.getElementById('loginPassword').value;
      const status = document.getElementById('authStatus'), btn = document.getElementById('authSubmitBtn');
      btn.disabled = true; status.textContent = 'Signing in...';
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient.from('app_users').select('*').eq('email', email).eq('password', password).maybeSingle();
          if (error) throw new Error(error.message); if (!data) throw new Error('Invalid email or password.');
          if (data.is_admin) localStorage.setItem('musically_admin_email', email);
          hydrateUserSession(data); await loadCatalog(); return;
        }
        hydrateUserSession({ id: 'local-' + Date.now(), full_name: email.split('@')[0], username: '@' + email.split('@')[0], email, is_admin: true, is_verified: true, subscription_tier: 'free', avatar_url: fallbackAvatarUrl(email.split('@')[0]) });
        render();
      } catch (err) { status.textContent = '❌ ' + (err.message || 'Sign in failed'); }
      finally { btn.disabled = false; }
    }

    function hydrateUserSession(user) {
      state.currentUser = user; state.subscriptionTier = (user.subscription_tier || 'free').toLowerCase();
      if (user.security_prefs) state.securityPrefs = user.security_prefs;
      if (Array.isArray(user.favorites)) state.favorites = user.favorites;
      if (Array.isArray(user.followed_artists)) state.followedArtists = user.followed_artists;
      if (Array.isArray(user.playlists)) state.playlists = user.playlists;
      if (Array.isArray(user.recently_played)) state.recentlyPlayed = user.recently_played;
      if (typeof user.plays_count === 'number') state.playsCount = user.plays_count;
      localStorage.setItem('musically_user', JSON.stringify(user)); localStorage.setItem('musically_tier', state.subscriptionTier);
      syncSessionChrome();
    }

    function evaluatePasswordStrength(pw) {
      if (!pw) return { label: '', pct: 0, color: 'bg-zinc-700' };
      let s = 0; if (pw.length >= 6) s++; if (pw.length >= 10) s++; if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
      return s <= 1 ? { label: 'Weak', pct: 30, color: 'bg-rose-500' } : s === 2 ? { label: 'Fair', pct: 60, color: 'bg-amber-500' } : { label: 'Strong', pct: 100, color: 'bg-emerald-500' };
    }
    function updatePasswordStrengthUI(pw) {
      const bar = document.getElementById('pwStrengthBar'), txt = document.getElementById('pwStrengthText'); if (!bar || !txt) return;
      const st = evaluatePasswordStrength(pw); bar.style.width = st.pct + '%'; bar.className = `h-full transition-all ${st.color}`; txt.textContent = st.label ? `Strength: ${st.label}` : '';
    }

    function jsonpRequest(url) {
      return new Promise((resolve) => {
        const cbName = 'm_jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 1000000), script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); resolve(null); }, 7000);
        function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
        window[cbName] = (data) => { cleanup(); resolve(data); }; script.onerror = () => { cleanup(); resolve(null); };
        script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${cbName}`; document.body.appendChild(script);
      });
    }
    function parseIsoDurationMs(iso) { const m = (iso || '').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); return m ? ((parseInt(m[1] || '0', 10) * 3600) + (parseInt(m[2] || '0', 10) * 60) + parseInt(m[3] || '0', 10)) * 1000 : 0; }
    function decodeHtmlEntities(str) { const txt = document.createElement('textarea'); txt.innerHTML = str || ''; return txt.value; }
    function cleanYouTubeTrackTitle(rawTitle, artistNameEn, artistNameAr) {
      let t = decodeHtmlEntities(rawTitle || '').replace(/\(Official.*?\)|\[Official.*?\]|\(Music Video\)|\[Music Video\]|\(Audio\)|\[Audio\]|\(Lyric.*?\)|\[Lyric.*?\]|\(4K.*?\)|\[4K.*?\]|فيديو كليب|أغنية|اغنية|كلمات|حصرياً/gi, '');
      const escEn = artistNameEn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), escAr = (artistNameAr || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      t = t.replace(new RegExp(`^${escEn}\\s*[-–—|:]\\s*`, 'i'), ''); if (escAr) t = t.replace(new RegExp(`^${escAr}\\s*[-–—|:]\\s*`, 'i'), '');
      return t.replace(/\s{2,}/g, ' ').trim() || decodeHtmlEntities(rawTitle || '');
    }

      const addItem = (t) => { if (t && t.title && !map.has(t.title.toLowerCase().trim())) map.set(t.title.toLowerCase().trim(), { title: t.title.trim(), album: (t.album?.title || 'Full Track').trim(), cover: t.album?.cover_xl || t.album?.cover_big || t.album?.cover_medium || portrait || null }); };
      if (dzId) { const topRes = await jsonpRequest(`https://api.deezer.com/artist/${dzId}/top?limit=50&output=jsonp`); (topRes?.data || []).forEach(addItem); }
      const trRes = await jsonpRequest(`https://api.deezer.com/search/track?q=${encodeURIComponent(query)}&limit=50&output=jsonp`); (trRes?.data || []).forEach(addItem);

        const sRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=50&q=${encodeURIComponent(query)}&key=${encodeURIComponent(currentKey)}`);
        const sData = await sRes.json();
        if (sData.error) { const reason = sData.error.errors?.[0]?.reason || ''; if (reason === 'quotaExceeded' || reason === 'dailyLimitExceeded' || sRes.status === 403) { ytKeysList.shift(); continue; } throw new Error(sData.error.message); }
        const videoIds = (sData.items || []).map(it => it.id?.videoId).filter(id => id && !existingYtIdsSet.has(`yt:${id}`));
        if (!videoIds.length) return 0;
        const dData = await (await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${videoIds.join(',')}&key=${encodeURIComponent(currentKey)}`)).json();
        const rows = [];
        for (const v of (dData.items || [])) {
          const durMs = parseIsoDurationMs(v.contentDetails?.duration), isTarab = /umm kulthum|abdel halim|abdel wahab/i.test(artist.name_en);

          const cleanTitle = cleanYouTubeTrackTitle(v.snippet?.title, artist.name_en, artist.name_ar), dzMatch = matchCleanTitleAgainstDeezer(cleanTitle, dzMap), ytKey = `yt:${v.id}`;
          if (existingYtIdsSet.has(ytKey)) continue; existingYtIdsSet.add(ytKey);
          rows.push({ artist_id: artist.id, title_en: dzMatch ? dzMatch.title : cleanTitle, title_ar: cleanTitle, album_title: dzMatch ? dzMatch.album : 'Full Track', cover_url: dzMatch?.cover || portrait || v.snippet?.thumbnails?.high?.url || artist.avatar_url || null, audio_url: ytKey, duration_ms: durMs });
        }
        if (!rows.length) return 0;
        const { error } = await supabaseClient.from('songs').insert(rows); if (error) throw error;
        return rows.length;
      }
      throw new Error('All YouTube API keys reached daily quota.');
    }

            <h3 class="text-base font-extrabold text-emerald-400">🎬 Import Full Songs from YouTube Playlist URL (1 Unit = 50 Songs)</h3>
            <div class="grid md:grid-cols-3 gap-3">
              <select id="plImportArtistSelect" required class="px-3.5 py-2.5 rounded-xl bg-black/60 border border-white/10 text-sm">${state.artists.map(a => `<option value="${a.id}">${a.name_en} (${a.name_ar})</option>`).join('')}</select>
              <input id="plImportUrl" required type="text" placeholder="Paste YouTube Playlist URL..." class="px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <button type="submit" class="py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-sm">Import Full Playlist</button>
            </div>
            <p id="plImportStatus" class="text-xs text-emerald-400"></p>
          </form>

          <div class="grid md:grid-cols-2 gap-6">
            <form onsubmit="handleCreateSinger(event)" class="p-5 rounded-3xl bg-[#14141D] border border-white/10 space-y-3">
              <h3 class="text-base font-extrabold text-violet-400">1. ${dict.addSinger}</h3>
              <input id="singerNameEn" required placeholder="English Name (e.g. Amr Diab)" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <input id="singerNameAr" required placeholder="الاسم بالعربية" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <textarea id="singerBio" rows="2" placeholder="Short biography..." class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm"></textarea>
              <input id="singerListeners" type="number" value="2500000" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <label class="flex items-center gap-2 text-xs text-zinc-300"><input id="singerVerifiedCheckbox" type="checkbox" checked class="w-4 h-4" /> Mark as Verified Artist</label>
              <div class="text-xs text-zinc-400"><label class="block mb-1">Avatar Photo:</label><input id="singerAvatarFile" type="file" accept="image/*" class="w-full text-xs" /></div>
              <div class="text-xs text-zinc-400"><label class="block mb-1">Cover Banner:</label><input id="singerCoverFile" type="file" accept="image/*" class="w-full text-xs" /></div>
              <button id="createSingerBtn" type="submit" class="w-full py-3 rounded-xl bg-violet-600 font-bold text-sm">Save Singer Profile</button>
              <p id="singerStatus" class="text-xs text-emerald-400"></p>
            </form>

            <form onsubmit="handleUploadSong(event)" class="p-5 rounded-3xl bg-[#14141D] border border-white/10 space-y-3">
              <h3 class="text-base font-extrabold text-fuchsia-400">2. ${dict.uploadSong}</h3>
              <select id="songArtistSelect" required class="w-full px-3.5 py-2.5 rounded-xl bg-black/60 border border-white/10 text-sm">${state.artists.map(a => `<option value="${a.id}">${a.name_en} (${a.name_ar})</option>`).join('')}</select>
              <input id="songTitleEn" required placeholder="Song Title (English)" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <input id="songTitleAr" required placeholder="اسم الأغنية (بالعربية)" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <input id="songAlbum" placeholder="Album Name (Auto-filled from Deezer if empty)" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <input id="songYtUrl" type="text" placeholder="YouTube Full Song URL or Video ID" class="w-full px-3.5 py-2.5 rounded-xl bg-black/40 border border-white/10 text-sm" />
              <div class="text-xs text-zinc-400"><label class="block mb-1">OR Upload Audio File:</label><input id="songAudioFile" type="file" accept="audio/*" class="w-full text-xs" /></div>
              <div class="text-xs text-zinc-400"><label class="block mb-1">Song Artwork:</label><input id="songCoverFile" type="file" accept="image/*" class="w-full text-xs" /></div>
              <button id="uploadSongBtn" type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 font-bold text-sm">Publish Full Song</button>
              <p id="songStatus" class="text-xs text-emerald-400"></p>
            </form>
          </div>

          <div class="p-5 rounded-3xl bg-[#14141D] border border-white/10 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div><h3 class="text-base font-extrabold">${dict.manageCatalog}</h3><p id="autoFetchStatus" class="text-xs text-emerald-400 mt-0.5"></p></div>
              <div class="flex flex-wrap items-center gap-2">
                <button id="autoImportSongsBtn" onclick="batchImportAllArtists50Each()" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-xs font-bold text-white shadow">${state.importRunning ? '⏹ Stop Import' : '🚀 Fast Import (50 Full Songs / Artist)'}</button>
                <label class="cursor-pointer px-3.5 py-2 rounded-xl bg-violet-600 text-xs font-bold text-white">📁 Bulk Folder<input type="file" webkitdirectory multiple accept="audio/*" onchange="handleBulkFolderUpload(event)" class="hidden" /></label>
                <input type="search" value="${state.adminFilter}" oninput="filterAdminCatalog(this.value)" placeholder="Filter..." class="px-3.5 py-2 rounded-xl bg-black/40 border border-white/10 text-xs sm:w-40" />
              </div>
            </div>

            <div class="space-y-2">
              <p class="text-xs font-bold text-violet-400">Singers (${state.artists.length})</p>
              ${state.artists.map(a => {
                const count = state.songs.filter(s => s.artist_id === a.id).length;
                return `
                  <div data-search="${(a.name_en + ' ' + a.name_ar).toLowerCase()}" class="admin-catalog-item flex flex-wrap items-center justify-between gap-2 p-2.5 rounded-xl bg-black/30 text-xs">
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                      <img src="${a.avatar_url || fallbackAvatarUrl(a.name_en)}" referrerpolicy="no-referrer" class="w-9 h-9 rounded-full object-cover shrink-0" />
                      <div class="truncate"><span class="font-bold text-white">${a.name_en}</span> ${a.is_verified ? renderVerifiedBadge('w-3.5 h-3.5') : ''} <span class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-zinc-300">${count} songs</span><p class="text-zinc-400 text-[11px]">${a.name_ar}</p></div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="batchImportSingleArtist50('${a.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 font-bold">🚀 +50</button>
                      <input id="quickPhotoInput-${a.id}" type="file" accept="image/*" onchange="handleQuickArtistPhoto(event, '${a.id}', 'avatar_url')" class="hidden" />
                      <input id="quickCoverInput-${a.id}" type="file" accept="image/*" onchange="handleQuickArtistPhoto(event, '${a.id}', 'cover_url')" class="hidden" />
                      <button onclick="triggerArtistPhotoUpload('${a.id}')" class="px-2.5 py-1 rounded-lg bg-violet-500/20 text-violet-300 font-bold">📷 Photo</button>
                      <button onclick="setArtistPhotoByUrl('${a.id}', '${a.name_en.replace(/'/g, "\\'")}', '${a.avatar_url || ''}')" class="px-2 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold">🔗 URL</button>
                      <button onclick="triggerArtistCoverUpload('${a.id}')" class="px-2 py-1 rounded-lg bg-fuchsia-500/20 text-fuchsia-300 font-bold">🖼️ Cover</button>
                      <button onclick="toggleVerifyArtist('${a.id}', ${!!a.is_verified})" class="px-2.5 py-1 rounded-lg font-bold ${a.is_verified ? 'bg-[#1D9BF0]/20 text-sky-300' : 'bg-white/10 text-zinc-400'}">${a.is_verified ? '✓ Verified' : 'Verify'}</button>
                      <button onclick="deleteArtist('${a.id}')" class="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 font-bold">Delete</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
              <p class="text-xs font-bold text-fuchsia-400">Full Songs (${state.songs.length.toLocaleString()} — click ✏️ Edit to rename, move artist, or change cover/link)</p>
              ${state.songs.slice(0, 200).map(s => {
                const ar = getArtistById(s.artist_id);
                return `
                  <div data-search="${(s.title_en + ' ' + s.title_ar + ' ' + ar.name_en + ' ' + (s.album_title || '')).toLowerCase()}" class="admin-catalog-item flex items-center justify-between gap-2 p-2.5 rounded-xl bg-black/30 text-xs">
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                      <img src="${s.cover_url || ar.avatar_url || ''}" referrerpolicy="no-referrer" class="w-8 h-8 rounded-md object-cover shrink-0 bg-zinc-800" />
                      <div class="truncate">
                        <p class="font-bold text-white truncate">${s.title_en} <span class="text-zinc-400 font-normal">(${s.title_ar})</span></p>
                        <p class="text-[11px] text-zinc-400 truncate">${ar.name_en} • ${s.album_title || 'Single'} • ${s.duration_ms ? formatSec(s.duration_ms / 1000) : 'Full'}</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="openAdminSongModal('${s.id}')" class="px-2.5 py-1 rounded-lg bg-violet-500/25 text-violet-300 hover:bg-violet-500/35 font-bold">✏️ Edit</button>
                      <button onclick="deleteSong('${s.id}')" class="px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 font-bold">Delete</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      syncSessionChrome();
      syncPlayPauseIcons(state.isPlaying);
      syncTransportIcons();
      updateFavIcon();
      const root = document.getElementById('appRoot');
      if (!state.currentUser) { root.innerHTML = renderAuthScreen(); return; }
      if (state.route === 'home') root.innerHTML = renderHome();
      else if (state.route === 'artist') root.innerHTML = renderArtistProfile();
      else if (state.route === 'search') root.innerHTML = renderSearch();
      else if (state.route === 'playlists') root.innerHTML = renderPlaylistsPage();
      else if (state.route === 'favorites') root.innerHTML = renderFavorites();
      else if (state.route === 'profile') root.innerHTML = renderUserProfile();
      else if (state.route === 'admin') root.innerHTML = renderAdmin();
      if (state.route === 'admin' && state.adminFilter) filterAdminCatalog(state.adminFilter);
      if (state.route === 'admin' && state.userSearchFilter) filterAdminUsers(state.userSearchFilter);
    }

    loadYouTubeIframeApi();
    applyLanguage();
    initSupabase();
    syncSessionChrome();
    syncPlayPauseIcons(false);
    syncTransportIcons();
    loadCatalog();
  </script>
</body>
</html>
